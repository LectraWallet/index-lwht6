<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Google Docs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234285f4' d='M6 2h9l5 5v15H6z'/%3E%3Cpath fill='%23fff' d='M9 12h6M9 16h6M9 8h3' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0e11; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; background: #12161a; border-bottom: 1px solid #232a30;
  }
  .logo { color: #e8edf0; font-weight: 700; font-size: 15px; padding: 0 6px 0 2px; user-select: none; }
  button {
    background: #1c2329; color: #dfe6ea; border: 1px solid #2b343c; border-radius: 8px;
    height: 34px; min-width: 36px; padding: 0 10px; font-size: 15px; cursor: pointer;
  }
  button:active { background: #262f37; }
  button:disabled { opacity: .45; cursor: default; }
  #url {
    flex: 1; height: 34px; padding: 0 12px; font-size: 14px; color: #e8edf0;
    background: #0d1114; border: 1px solid #2b343c; border-radius: 8px; outline: none; min-width: 0;
  }
  #url:focus { border-color: #4a5a66; }
  #status { color: #8b98a1; font-size: 12px; white-space: nowrap; padding: 0 4px; user-select: none; }
  #status.err { color: #ff7b72; }
  #frames { flex: 1; min-height: 0; }
  #frames iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
</style>
</head>
<body>
<header>
  <span class="logo">SJ</span>
  <button id="backBtn" title="Back" disabled>&larr;</button>
  <button id="fwdBtn" title="Forward" disabled>&rarr;</button>
  <button id="reloadBtn" title="Reload" disabled>&#8635;</button>
  <input id="url" type="text" placeholder="Search or enter a URL" autocomplete="off" spellcheck="false" />
  <button id="goBtn">Go</button>
  <button id="fsBtn" title="Fullscreen">&#9974;</button>
  <span id="status">starting…</span>
</header>
<div id="frames"></div>
<script src="./vendor/baremux/index.js"></script>
<script src="./vendor/scram/scramjet.all.js"></script>
<script src="./app.js"></script>
</body>
</html>
